name: Scheduled Monitor Run

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run benchmark pass
        run: python -m scripts.load_benchmark --n 30 --run-id "scheduled-$(date -u +%Y%m%d-%H%M%S)"
      - name: Embed responses
        run: python -m scripts.embed_calls
      - name: Score for hallucinations
        run: python -m scripts.score_hallucination
      - name: Write incident reports for flagged calls
        run: python -m scripts.run_agents
      - name: Check drift against the previous run
        run: python -m scripts.psi_drift
      - name: Alert if thresholds are breached
        run: python -m scripts.check_alerts
