name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Only the pure-math modules (app/drift.py, app/hallucination.py) are
      # tested -- no Supabase or DashScope credentials needed for CI.
      - run: pytest tests/ -v
